name: CI

# A pull request runs once, on its own event; a push runs only on main.
# There is no path filter on purpose: this is the one check a pull request must pass,
# and a required check that never reports would block a change to a file it does not read.
on:
  push:
    branches: [main]
  pull_request:

# This workflow reads the repository and nothing else. It holds no secret and never contacts EZID:
# a workflow that mints is a separate, manually dispatched one in a protected environment (ADR 0005).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The transition check reads the base revision's registry.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run schema --check
      - run: bun run validate
      # No registered DOI is deleted, renamed, rewound or reassigned (ADR 0004).
      - if: github.event_name == 'pull_request'
        run: bun run transitions "origin/${BASE_REF}"
        env:
          BASE_REF: ${{ github.base_ref }}
