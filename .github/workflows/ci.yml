name: CI

# A pull request runs once, on its own event; a push runs only on main.
# There is no path filter on purpose: this is the one check a pull request must pass,
# and a required check that never reports would block a change to a file it does not read.
on:
  push:
    branches: [main]
  pull_request:

# This workflow reads the repository and nothing else. It holds no secret and never contacts EZID:
# a workflow that mints is a separate, manually dispatched one in a protected environment (ADR 0005).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The transition check reads the base revision's registry.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run schema --check
      - run: bun run validate
      # No registered DOI is deleted, renamed, rewound or reassigned, and none is issued by hand
      # (ADR 0004, ADR 0005). Only the mint run's own result may take a record from planned to
      # issued: a pull request from the branch mint/<suffix> opened by github-actions[bot], or the
      # push that merges it, whose subject is "Mint <doi>". Everything else is refused.
      - name: Transitions
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
          BEFORE: ${{ github.event.before }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: |
          allow=()
          if [ "$EVENT" = "pull_request" ]; then
            base="origin/${BASE_REF}"
            case "$HEAD_REF" in
              mint/*) [ "$ACTOR" = "github-actions[bot]" ] && allow=(--allow-issue "10.82901/${HEAD_REF#mint/}") ;;
            esac
          else
            base="$BEFORE"
            case "$(printf '%s' "$SUBJECT" | head -n 1)" in
              "Mint 10.82901/"*) allow=(--allow-issue "$(printf '%s' "$SUBJECT" | head -n 1 | cut -d' ' -f2)") ;;
            esac
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "no base revision: nothing to compare"
          else
            bun run transitions "$base" "${allow[@]}"
          fi
